name: Update PRS Data Dashboard

on:
  # Run every day at 07:00 UTC (adjust to taste)
  schedule:
    - cron: "0 7 * * *"

  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:

jobs:
  update-data:
    name: Fetch latest statistics
    runs-on: ubuntu-latest

    # Give the workflow write access to push data changes back to the repo
    permissions:
      contents: write

    steps:
      # ── 1. Check out the repository ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so the git push works correctly
          fetch-depth: 1

      # ── 2. Set up Python ─────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ── 3. Install dependencies ──────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 openpyxl lxml

      # ── 4. Run the data updater ───────────────────────────────────────────
      - name: Fetch latest data from all sources
        run: python scripts/update_data.py

      # ── 5. Commit and push if anything changed ───────────────────────────
      - name: Commit updated data files
        run: |
          git config user.name  "NRLA Data Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # Only commit if there are actual changes
          if git diff --staged --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "Data update: $(date -u +'%Y-%m-%d')"
            git push
            echo "Data changes committed and pushed ✓"
          fi
